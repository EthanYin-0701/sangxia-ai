name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:docs
      - run: npm run build
      # The smoke scripts import from dist/, built once above. Globbing picks
      # up new smoke-*.mjs scripts without editing this file.
      - name: Smoke tests
        run: |
          set -e
          for f in scripts/smoke*.mjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
